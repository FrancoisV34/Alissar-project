# Intégration continue : chaque push et chaque pull request passe par ces contrôles.
# Le déploiement (deploy.yml) ne se déclenche que si ce workflow réussit.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Analyse statique (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint

  tests:
    name: Tests unitaires, intégration, sécurité, fuzzing + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Vitest avec couverture (seuil bloquant 80 % sur le serveur)
        run: npm run test:coverage
      - name: Résumé de couverture
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total;console.log('| Mesure | Couverture |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+s[k].pct+' % |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de couverture (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapport-couverture, path: coverage/, retention-days: 14 }

  e2e:
    name: Tests de bout en bout (Playwright + axe-core)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env: { CI: 'true' }
      - name: Rapport Playwright (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapport-playwright, path: playwright-report/, retention-days: 14 }

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Aucune vulnérabilité élevée ou critique en production
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Image Docker + test de fumée
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image de production
        run: docker build -t alissar-vitrine:ci .
      - name: Démarrage du conteneur et attente de la sonde de santé
        run: |
          docker run -d --name app -p 3001:3001 \
            -e JWT_SECRET=secret-de-ci-uniquement-0123456789abcdef \
            -e ADMIN_EMAIL=admin@ci.local -e ADMIN_PASSWORD=Mot-de-passe-de-ci-1 \
            alissar-vitrine:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2
          done
          docker inspect -f 'santé : {{.State.Health.Status}}' app
      - name: Test de fumée
        run: |
          set -e
          curl -fsS localhost:3001/healthz
          curl -fsS localhost:3001/api/site-config > /dev/null
          curl -fsS localhost:3001/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/admin/users)" = 401
          curl -sI localhost:3001/ | grep -qi '^content-security-policy:'
          echo "Utilisateur du processus : uid $(docker exec app awk '/^Uid/{print $2}' /proc/1/status)"
          test "$(docker exec app awk '/^Uid/{print $2}' /proc/1/status)" = 1000
      - name: Journaux du conteneur
        if: always()
        run: docker logs app 2>&1 | grep -v -i password | tail -30
