# Intégration et déploiement continus. Chaque push et chaque pull request passe par
# les contrôles ci-dessous. Les deux jobs de déploiement, en fin de fichier, ne
# démarrent que si TOUS les contrôles ont réussi (needs), et uniquement sur un push :
#   develop → recette    (alissar-staging, automatique)
#   main    → production (alissar-vitrine, après approbation dans l'environnement
#                         GitHub « production », limité à la branche main)
# Les déploiements sont dans ce workflow, et non dans un workflow déclenché par
# workflow_run : ce dernier s'exécute toujours sur la branche par défaut, ce qui rendait
# la restriction de branche de l'environnement inapplicable (incident du 17/11/2026).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # On n'interrompt jamais une exécution sur develop ou main : elle peut être en train de déployer.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Analyse statique (ESLint)
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest a basculé sur 26.04, non supportée par Playwright 1.56
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint

  tests:
    name: Tests unitaires, intégration, sécurité, fuzzing + couverture
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest a basculé sur 26.04, non supportée par Playwright 1.56
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Vitest avec couverture (seuil bloquant 80 % sur le serveur)
        run: npm run test:coverage
      - name: Résumé de couverture
        if: always()
        run: |
          node -e "const s=require('./coverage/coverage-summary.json').total;console.log('| Mesure | Couverture |\n|---|---|\n'+['lines','statements','functions','branches'].map(k=>'| '+k+' | '+s[k].pct+' % |').join('\n'))" >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport de couverture (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapport-couverture, path: coverage/, retention-days: 14 }

  e2e:
    name: Tests de bout en bout (Playwright + axe-core)
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest a basculé sur 26.04, non supportée par Playwright 1.56
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env: { CI: 'true' }
      - name: Rapport Playwright (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: rapport-playwright, path: playwright-report/, retention-days: 14 }

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest a basculé sur 26.04, non supportée par Playwright 1.56
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Aucune vulnérabilité élevée ou critique en production
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest a basculé sur 26.04, non supportée par Playwright 1.56
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Image Docker + test de fumée
    runs-on: ubuntu-24.04   # version fixée : ubuntu-latest a basculé sur 26.04, non supportée par Playwright 1.56
    needs: [tests]
    steps:
      - uses: actions/checkout@v5
      - name: Construction de l'image de production
        run: docker build -t alissar-vitrine:ci .
      - name: Démarrage du conteneur et attente de la sonde de santé
        run: |
          # Secrets générés à chaque exécution : rien de sensible n'est écrit dans le dépôt.
          docker run -d --name app -p 3001:3001 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL=admin@ci.local -e ADMIN_PASSWORD="$(openssl rand -base64 18)" \
            alissar-vitrine:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2
          done
          docker inspect -f 'santé : {{.State.Health.Status}}' app
      - name: Test de fumée
        run: |
          set -e
          curl -fsS localhost:3001/healthz
          curl -fsS localhost:3001/api/site-config > /dev/null
          curl -fsS localhost:3001/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3001/api/admin/users)" = 401
          curl -sI localhost:3001/ | grep -qi '^content-security-policy:'
          echo "Utilisateur du processus : uid $(docker exec app awk '/^Uid/{print $2}' /proc/1/status)"
          test "$(docker exec app awk '/^Uid/{print $2}' /proc/1/status)" = 1000
      - name: Journaux du conteneur
        if: always()
        run: docker logs app 2>&1 | grep -v -i password | tail -30

  recette:
    name: Déploiement en recette
    needs: [lint, tests, e2e, audit, secrets, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    environment:
      name: recette
      url: https://alissar-staging.fly.dev
    concurrency: deploy-recette
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Déploiement
        run: flyctl deploy --config fly.staging.toml --remote-only
        env: { FLY_API_TOKEN: '${{ secrets.FLY_API_TOKEN_STAGING }}' }
      - name: Test de fumée
        run: sh scripts/smoke-test.sh https://alissar-staging.fly.dev

  production:
    name: Déploiement en production
    needs: [lint, tests, e2e, audit, secrets, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production          # protections : approbation manuelle + branche main uniquement
      url: https://alissar-vitrine.fly.dev
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # Sauvegarde 1 (bloquante) : instantané du volume, indépendant de l'image en service.
      - name: Instantané du volume avant déploiement
        run: |
          VOL=$(flyctl volumes list --app alissar-vitrine --json | jq -r '.[] | select(.name == "alissar_data") | .id' | head -1)
          test -n "$VOL"
          flyctl volumes snapshots create "$VOL" --app alissar-vitrine
        env: { FLY_API_TOKEN: '${{ secrets.FLY_API_TOKEN }}' }
      # Sauvegarde 2 (complément) : copie SQLite sur le volume, restaurable en quelques secondes.
      # Non bloquante : le script n'existe pas dans les versions antérieures à cette chaîne.
      - name: Sauvegarde SQLite sur le volume
        continue-on-error: true
        run: |
          curl -fsS https://alissar-vitrine.fly.dev/healthz > /dev/null   # réveille la machine
          flyctl ssh console --app alissar-vitrine -C "node /app/server/scripts/db-backup.js"
        env: { FLY_API_TOKEN: '${{ secrets.FLY_API_TOKEN }}' }
      - name: Déploiement
        run: flyctl deploy --remote-only
        env: { FLY_API_TOKEN: '${{ secrets.FLY_API_TOKEN }}' }
      - name: Test de fumée
        run: sh scripts/smoke-test.sh https://alissar-vitrine.fly.dev
