<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var key = 'mb-color-scheme';
        var stored = localStorage.getItem(key);
        var scheme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      })();
    </script>

    <title>Cabinet Medical — Praticien</title>
    <meta name="description" content="Cabinet de praticien. Consultations personnalisees. Prise de rendez-vous en ligne." />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="fr-FR" />

    <!-- Performance & Technical -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#fa8072" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Fonts Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
